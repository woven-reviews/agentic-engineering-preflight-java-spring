name: preflight

# The same images, the same bind-mount-and-run shape, and the same cache volumes as
# the assessment stack — so a run here leaves your Maven and Bun caches warm for it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: preflight
      POSTGRES_DB: preflight
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight -d preflight"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: ./mvnw -B spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/preflight
      SPRING_DATASOURCE_USERNAME: preflight
      SPRING_DATASOURCE_PASSWORD: preflight
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/utils/health-check/ | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    image: oven/bun:1.3
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'await fetch(\"http://localhost:5173\")'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  maven-cache:
  frontend-node-modules:
